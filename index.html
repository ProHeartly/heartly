<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heartly</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="theme.js"></script>
</head>
<div>
    <div class="screen">
        <div class="grid">
            <div class="card search">
                <label class="search-label">
                    <i class="ph-bold ph-magnifying-glass"></i>
                    <input type="search" placeholder="Search..." class="search-input">
                </label>
            </div>
            <a href="./blog.html" class="card blog">
                <h1>Blog</h1>
                <p>Random posts by me</p>
            </a>
            <div class="card theme" id="theme-toggle">
                <i class="ph-fill ph-moon" id="theme-icon"></i>
            </div>
            <a href="https://github.com/ProHeartly/" target="_blank" rel="noopener" class="card git">
                <i class="ph-fill ph-github-logo"></i>
            </a>
            <a href="./projects.html" class="card projects">
                <h1>Very Cool Projects</h1>
                <p>Cool like me</p>
            </a>
            <a href="./gallery.html" class="card gallery">
                <h1>Image Gallery</h1>
                <p>What maybe inside??</p>
            </a>
            <a href="./about.html" class="card about">
                <h1>About Me</h1>
                <p>Who is this random guy?</p>
            </a>
            <div class="card heart">
                <i class="ph-fill ph-heart heart-pulse"></i>
                <h1>Heart me</h1>

            </div>
            <a href="https://hcb.hackclub.com/donations/start/stem-club-of-aroma" target="_blank" rel="noopener" class="card donate">
                <i class="ph-fill ph-hand-heart"></i>
            </a>
        </div>
    </div>
</body>
</html>
